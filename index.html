<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUPPORT - JY | 软件硬件支持服务</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <h1 class="logo">SUPPORT - JY</h1>
            <p class="tagline">帮助客户解决软件和硬件问题</p>
        </div>
    </header>

    <!-- Latest News Section (Top Priority) -->
    <section class="latest-news" id="latestNews">
        <div class="container">
            <h2>📢 最新消息</h2>
            <div class="news-container" id="newsContainer">
                <div class="loading">加载中...</div>
            </div>
        </div>
    </section>

    <!-- Services Section -->
    <section class="services">
        <div class="container">
            <h2>🛠️ 我们提供的服务</h2>
            
            <!-- Software Services -->
            <div class="service-category">
                <h3 class="software-title">💻 软件支持</h3>
                <div class="service-grid" id="softwareServices">
                    <div class="loading">加载中...</div>
                </div>
            </div>

            <!-- Hardware Services -->
            <div class="service-category">
                <h3 class="hardware-title">🖥️ 硬件支持</h3>
                <div class="service-grid" id="hardwareServices">
                    <div class="loading">加载中...</div>
                </div>
            </div>
        </div>
    </section>

    <!-- Contact Section -->
    <section class="contact">
        <div class="container">
            <h2>📞 联系我们</h2>
            <div class="contact-grid">
                <!-- WhatsApp -->
                <div class="contact-card whatsapp">
                    <h3>💬 WhatsApp</h3>
                    <a href="#" id="whatsappLink" target="_blank" class="contact-link">
                        <span id="whatsappText">加载中...</span>
                    </a>
                </div>

                <!-- Email -->
                <div class="contact-card email">
                    <h3>📧 邮箱</h3>
                    <div class="email-list" id="emailList">
                        <div class="loading">加载中...</div>
                    </div>
                </div>

                <!-- Working Hours -->
                <div class="contact-card hours">
                    <h3>⏰ 工作时间</h3>
                    <div id="workingHours">
                        <div class="loading">加载中...</div>
                    </div>
                </div>

                <!-- Address -->
                <div class="contact-card address">
                    <h3>📍 地址</h3>
                    <p id="addressText">加载中...</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Company Info -->
    <section class="company-info">
        <div class="container">
            <h2>🌐 关于我们</h2>
            <p>我们致力于为客户提供最优质的软件和硬件支持服务。</p>
            <a href="#" id="websiteLink" target="_blank" class="company-link">
                访问公司网站 →
            </a>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 SUPPORT - JY. 版权所有。</p>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
